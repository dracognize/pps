[tasks.bootstrap]
run = "python scripts/bootstrap.py"

[tasks.configure]
run = "cmake -S . -B build -G Ninja"

[tasks.build]
depends = ["configure"]
run = "cmake --build build"

[tasks.clean]
run = "cmake -E remove_directory build"

[tasks.run]
run = "python scripts/run.py"

[tasks.dev]
run = [
	{task = "build"},
	{task = "run"},
]

[tasks.rebuild]
run = [
	{task = "bootstrap"},
	{task = "clean"},
	{task = "build"},
	{task = "run"},
]
