[tasks.bootstrap]
run = "python bootstrap.py"

[tasks.configure]
run = "cmake -S . -B build -G Ninja"

[tasks.build]
depends = ["configure"]
run = "cmake --build build"

[tasks.clean]
run = "cmake -E remove_directory build"

[tasks.dev]
depends = ["build"]
run = "python scripts/run.py"

[tasks.rebuild]
run = [
	"mise run clean",
	"mise run bootstrap",
	"mise run configure",
	"mise run dev",
]
